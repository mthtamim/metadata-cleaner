<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; width: 300px; padding: 18px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0a1512; color: #e9f5f0;
      }
      .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
      .brand img { width: 34px; height: 34px; }
      .brand h1 { font-size: 17px; margin: 0; }
      p { font-size: 12.5px; line-height: 1.5; color: #a7c4ba; margin: 6px 0 14px; }
      button {
        display: block; width: 100%; padding: 11px 12px; margin-bottom: 9px;
        border: 0; border-radius: 12px; cursor: pointer;
        font-size: 14px; font-weight: 600; color: #06251e;
        background: linear-gradient(135deg, #14b8a6, #8b5cf6);
        color: #fff;
      }
      button.secondary {
        background: rgba(255,255,255,.07); color: #e9f5f0;
        border: 1px solid rgba(255,255,255,.14); font-weight: 500;
      }
      .note { font-size: 11px; color: #7d9a91; margin: 2px 0 0; text-align: center; }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="icons/icon48.png" alt="" />
      <h1>Metadata Cleaner</h1>
    </div>
    <p>Scan, remove &amp; edit hidden metadata in photos, PDFs and Office files. Everything runs locally — files never leave your device.</p>
    <button id="openApp">Open Metadata Cleaner</button>
    <button id="openSite" class="secondary">Open web version (GitHub Pages)</button>
    <button id="openRepo" class="secondary">GitHub repository</button>
    <p class="note">JPG · PNG · PDF · DOCX · XLSX · PPTX</p>
    <script src="popup.js"></script>
  </body>
</html>
